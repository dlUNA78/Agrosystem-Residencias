services:
  app:
    ports: !reset []
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:80'
    volumes:
      - ./docker/nginx/loadtest-replicas.conf:/etc/nginx/nginx.conf:ro
    cpus: ${NGINX_CPUS:-1.0}
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    restart: unless-stopped
