services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
    environment:
      POSTGRES_DB: ${DB_NAME:-agrosystem_loadtest}
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env.loadtest}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env.loadtest}
    ports:
      - '${PG_HOST_PORT:-5433}:5432'
    volumes:
      - pg_loadtest_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pg-stat-statements.sql:/docker-entrypoint-initdb.d/01-pg-stat-statements.sql:ro
    cpus: ${PG_CPUS:-2.0}
    mem_limit: ${PG_MEM_LIMIT:-1536m}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      DB_NAME: ${DB_NAME:-agrosystem_loadtest}
      DB_USER: ${DB_USER:?Define DB_USER en .env.loadtest}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env.loadtest}
      LOADTEST_AUTO_SEED: ${LOADTEST_AUTO_SEED:-true}
      LOADTEST_FARMS: ${LOADTEST_FARMS:-50000}
      LOADTEST_CYCLES: ${LOADTEST_CYCLES:-50000}
      LOADTEST_AUDIT: ${LOADTEST_AUDIT:-500000}
      LOADTEST_NOTIFICATIONS: ${LOADTEST_NOTIFICATIONS:-50000}
      LOADTEST_SESSIONS: ${LOADTEST_SESSIONS:-100000}
    command: ['node', 'src/scripts/bootstrapLoadtestDb.js']
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      DB_NAME: ${DB_NAME:-agrosystem_loadtest}
      DB_USER: ${DB_USER:?Define DB_USER en .env.loadtest}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env.loadtest}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env.loadtest}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agrosystem.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env.loadtest}
      FARMER_EMAIL: ${FARMER_EMAIL:-agricultor@agrosystem.com}
      FARMER_PASSWORD: ${FARMER_PASSWORD:?Define FARMER_PASSWORD en .env.loadtest}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOADTEST_MODE: ${LOADTEST_MODE:-true}
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-true}
    ports:
      - '${APP_PORT:-3000}:3000'
    cpus: ${APP_CPUS:-2.0}
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/auth/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pg_loadtest_data:
