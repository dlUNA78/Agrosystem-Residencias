worker_processes auto;
worker_rlimit_nofile 8192;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log off;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 10000;

  # Mantener la compresión en Express para comparar CPU 1 vs 2 vs 4 réplicas en igualdad de condiciones.
  gzip off;

  # DNS interno de Docker Compose para resolver réplicas dinámicas de "app".
  resolver 127.0.0.11 valid=2s ipv6=off;

  upstream app_backend {
    zone app_backend 64k;
    server app:3000 resolve;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 16 16k;
      proxy_busy_buffers_size 64k;
    }
  }
}
